name: QA CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  REPORT_ROOT: site

jobs:
  playwright:
    name: Playwright UI & API Tests
    runs-on: ubuntu-latest
    environment: Playwright standard Env

    env:
      BASE_URL: ${{ secrets.BASE_URL }}
      TEST_DATA_API: ${{ secrets.TEST_DATA_API }}
      TEST_DATA_SCHEMA: ${{ secrets.TEST_DATA_SCHEMA }}
      TIMEOUT: ${{ secrets.TIMEOUT }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests (Ortoni only)
        id: playwright_tests
        run: |
          npx playwright test --reporter=ortoni-report
        continue-on-error: true

      - name: Prepare site from Ortoni report
        run: |
          echo "📦 Preparing site from Ortoni report"
          mkdir -p site
          cp -r ortoni-report/* site/

      - name: Upload Ortoni site artifact
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: site
          retention-days: 30

    outputs:
      playwright_status: ${{ steps.playwright_tests.outcome }}

  k6:
    name: k6 Performance Tests
    runs-on: ubuntu-latest
    needs: playwright
    continue-on-error: true

    strategy:
      matrix:
        test: [load, performance, stress, security]

    env:
      BASE_URL: ${{ secrets.BASE_URL }}
      TEST_DATA_API: ${{ secrets.TEST_DATA_API }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: grafana/setup-k6-action@v1

      - name: Run k6 ${{ matrix.test }} test
        run: |
          mkdir -p site/k6/${{ matrix.test }}
          k6 run performance-tests/k6/${{ matrix.test }}.test.js \
            --out json=site/k6/${{ matrix.test }}/results.json
        continue-on-error: true

      - name: Upload k6 results
        uses: actions/upload-artifact@v4
        with:
          name: k6-${{ matrix.test }}
          path: site/k6/${{ matrix.test }}

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: [playwright, k6]
    if: always()

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
